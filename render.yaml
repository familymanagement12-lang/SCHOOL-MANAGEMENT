services:
  - type: web
    name: mccarthy-hill-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: 10
      - key: AI_MAX_INPUT_CHARS
        value: 4000
      - key: AI_MAX_OUTPUT_TOKENS
        value: 1200
      - key: AI_REQUEST_TIMEOUT_MS
        value: 30000
      - key: AI_CONVERSATION_RETENTION_DAYS
        value: 30

  - type: web
    name: mccarthy-hill-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
